name: Release
run-name: Release ${{ github.ref_name }} (${{ github.event_name }})

on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
    inputs:
      mode:
        description: Verify only or publish the selected version tag
        required: true
        default: verify
        type: choice
        options:
          - verify
          - publish
      candidate_artifact_id:
        description: Reuse this verified Candidate Bundle artifact; empty selects the unique exact-source candidate for publication
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build once or verify the selected Candidate Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      REUSE_CANDIDATE: ${{ github.event_name == 'push' || github.event.inputs.mode == 'publish' || github.event.inputs.candidate_artifact_id != '' }}
    outputs:
      bundle_artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      bundle_digest: ${{ steps.identity.outputs.bundle_digest }}
    steps:
      - name: Check out the exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source identity and publication tag when requested
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up exact Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact npm
        if: env.REUSE_CANDIDATE != 'true'
        run: npm install --global npm@11.17.0 --no-audit --no-fund

      - name: Install locked dependencies
        if: env.REUSE_CANDIDATE != 'true'
        run: npm ci --no-audit --no-fund

      - name: Run the one complete repository build and verification pass
        if: env.REUSE_CANDIDATE != 'true'
        run: npm run release:check

      - name: Build deterministic Candidate Bundle
        if: env.REUSE_CANDIDATE != 'true'
        run: >-
          node scripts/release.mjs bundle
          --output-dir "$RUNNER_TEMP/candidate-bundle"

      - name: Resolve a successful exact-source Candidate Bundle
        if: env.REUSE_CANDIDATE == 'true'
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ github.event.inputs.candidate_artifact_id }}
        run: |
          set -euo pipefail
          node scripts/release.mjs resolve-artifact --artifact-id "$CANDIDATE_ARTIFACT_ID" > "$RUNNER_TEMP/reused-artifact.json"
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));for(const k of ["artifactId","runId"]){if(typeof r[k]!=="string"||!/^[1-9][0-9]*$/u.test(r[k]))throw new Error("Invalid resolved candidate "+k)}fs.appendFileSync(process.env.GITHUB_OUTPUT,"artifact_id="+r.artifactId+"\nrun_id="+r.runId+"\n")' "$RUNNER_TEMP/reused-artifact.json"

      - name: Download the selected prior-run candidate without rebuilding
        if: env.REUSE_CANDIDATE == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.reuse.outputs.artifact_id }}
          run-id: ${{ steps.reuse.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate-bundle
          digest-mismatch: error

      - name: Verify source candidate and record Bundle identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REUSE_CANDIDATE" == "true" ]]; then
            node scripts/release.mjs verify-transport --bundle-dir "$RUNNER_TEMP/candidate-bundle"
          else
            node scripts/release.mjs verify-source --bundle-dir "$RUNNER_TEMP/candidate-bundle"
          fi
          digest="$(sha256sum "$RUNNER_TEMP/candidate-bundle/candidate-bundle.json" | cut -d ' ' -f 1)"
          printf 'bundle_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload fixed Candidate Bundle
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-bundle/
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 7

  publish:
    name: Publish explicitly authorized Candidate Bundle
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'publish')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      BUNDLE_DIGEST: ${{ needs.verify.outputs.bundle_digest }}
    steps:
      - name: Check out the exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Download fixed Candidate Bundle by artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.bundle_artifact_id }}
          path: ${{ runner.temp }}/candidate-bundle
          digest-mismatch: error

      - name: Verify transported Bundle without rebuilding
        run: node scripts/release.mjs verify-transport --bundle-dir "$RUNNER_TEMP/candidate-bundle"

      - name: Verify publication event before attestation
        run: >-
          node scripts/release.mjs event-publication-boundary
          --bundle-dir "$RUNNER_TEMP/candidate-bundle" --bundle-digest "$BUNDLE_DIGEST"

      - name: Preflight GitHub Release
        id: publication_preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release.mjs event-publication-preflight \
            --bundle-dir "$RUNNER_TEMP/candidate-bundle" --bundle-digest "$BUNDLE_DIGEST" \
            > "$RUNNER_TEMP/publication-preflight.json"
          status="$(node -e 'const r=require(process.argv[1]); if(!["missing","draft","exact"].includes(r.status))process.exit(1); process.stdout.write(r.status)' "$RUNNER_TEMP/publication-preflight.json")"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Stage exact public asset inventory
        if: steps.publication_preflight.outputs.status == 'missing'
        run: >-
          node scripts/release.mjs stage-public-assets
          --bundle-dir "$RUNNER_TEMP/candidate-bundle"
          --output-dir "$RUNNER_TEMP/release-public-assets"

      - name: Attest public release assets
        if: steps.publication_preflight.outputs.status == 'missing'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-public-assets/*

      - name: Verify draft assets and publish immutable release
        if: steps.publication_preflight.outputs.status != 'exact'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release.mjs publish-github-event
          --bundle-dir "$RUNNER_TEMP/candidate-bundle" --bundle-digest "$BUNDLE_DIGEST"

  post_verify:
    name: Verify immutable hosted release state
    needs: [verify, publish]
    if: ${{ always() && needs.verify.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Check out the exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Download the same fixed Candidate Bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.bundle_artifact_id }}
          path: ${{ runner.temp }}/candidate-bundle
          digest-mismatch: error

      - name: Reverify transported Bundle without rebuilding
        run: node scripts/release.mjs verify-transport --bundle-dir "$RUNNER_TEMP/candidate-bundle"

      - name: Verify immutable hosted bytes and provenance
        if: needs.publish.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs post-verify --bundle-dir "$RUNNER_TEMP/candidate-bundle"

      - name: Reconcile remote state after failed publication
        if: needs.publish.result == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_DIGEST: ${{ needs.verify.outputs.bundle_digest }}
        run: |
          set -euo pipefail
          node scripts/release.mjs reconcile-github-event --bundle-dir "$RUNNER_TEMP/candidate-bundle" --bundle-digest "$BUNDLE_DIGEST" > "$RUNNER_TEMP/publication-reconciliation.json"
          cat "$RUNNER_TEMP/publication-reconciliation.json"
          node -e 'const r=require(process.argv[1]);if(r.status!=="exact")process.exit(1)' "$RUNNER_TEMP/publication-reconciliation.json"
