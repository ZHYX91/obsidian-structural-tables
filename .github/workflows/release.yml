name: Release
run-name: release ${{ inputs.release_run_id }}

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Stable workspace release-run UUID
        required: true
        type: string
      mode:
        description: Explicit release operation
        required: true
        default: verify
        type: choice
        options:
          - verify
          - publish
      candidate_commit:
        description: Exact accepted candidate commit
        required: true
        type: string
      candidate_digest:
        description: SHA-256 of the exact core candidate.json
        required: true
        type: string
      candidate_envelope_digest:
        description: SHA-256 of the workspace candidate envelope
        required: true
        type: string
      acceptance_closure_digest:
        description: SHA-256 of the decoded acceptance-closure bytes
        required: true
        type: string
      acceptance_closure_b64:
        description: Base64 of the portable acceptance-closure JSON bytes
        required: true
        type: string
      release_authorization:
        description: Exact core publication authorization phrase
        required: true
        type: string
      authorization_b64:
        description: Base64 of the exact publication-authorization JSON bytes
        required: true
        type: string
      authorization_digest:
        description: SHA-256 of the decoded publication-authorization bytes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact candidate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      candidate_artifact_id: ${{ steps.handoff.outputs.artifact-id }}
      candidate_artifact_digest: ${{ steps.handoff.outputs.artifact-digest }}
    steps:
      - name: Validate dispatch identifiers
        shell: bash
        env:
          MODE: ${{ github.event.inputs.mode }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          CANDIDATE_ENVELOPE_DIGEST: ${{ inputs.candidate_envelope_digest }}
          ACCEPTANCE_CLOSURE_DIGEST: ${{ inputs.acceptance_closure_digest }}
          AUTHORIZATION_DIGEST: ${{ inputs.authorization_digest }}
        run: |
          set -euo pipefail
          [[ "$MODE" == "verify" || "$MODE" == "publish" ]]
          [[ "$RELEASE_RUN_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_ENVELOPE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ACCEPTANCE_CLOSURE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$AUTHORIZATION_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$CANDIDATE_COMMIT" = "$GITHUB_SHA"
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

      - name: Check out the exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged source identity
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --verify "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 --no-audit --no-fund
          test "$(npm --version)" = "11.17.0"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run complete repository release gates
        run: npm run release:check

      - name: Build deterministic candidate handoff
        run: >-
          node scripts/release.mjs candidate
          --version "$GITHUB_REF_NAME"
          --output "$RUNNER_TEMP/release-candidate"

      - name: Verify candidate identity and handoff
        shell: bash
        env:
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$RUNNER_TEMP/release-candidate/candidate.json" | cut -d ' ' -f 1)" = "$CANDIDATE_DIGEST"
          node scripts/release.mjs verify-handoff --candidate-dir "$RUNNER_TEMP/release-candidate"

      - name: Upload fixed candidate handoff
        id: handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ inputs.release_run_id }}
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 1

  publish:
    name: Publish explicitly authorized candidate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'publish'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out the exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Download fixed candidate handoff by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/release-candidate
          digest-mismatch: error

      - name: Verify transported acceptance and authorization evidence
        shell: bash
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          CANDIDATE_ENVELOPE_DIGEST: ${{ inputs.candidate_envelope_digest }}
          ACCEPTANCE_CLOSURE_B64: ${{ inputs.acceptance_closure_b64 }}
          ACCEPTANCE_CLOSURE_DIGEST: ${{ inputs.acceptance_closure_digest }}
          AUTHORIZATION_B64: ${{ inputs.authorization_b64 }}
          RELEASE_AUTHORIZATION: ${{ inputs.release_authorization }}
          AUTHORIZATION_DIGEST: ${{ inputs.authorization_digest }}
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/release-candidate
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/release-evidence
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import path from "node:path";

          const SHA256 = /^[0-9a-f]{64}$/u;
          const GIT_ID = /^(?:[0-9a-f]{40}|[0-9a-f]{64})$/u;
          const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/iu;
          const exactKeys = (value, keys, label) => {
            assert.ok(value !== null && typeof value === "object" && !Array.isArray(value), label);
            assert.deepEqual(Object.keys(value).sort(), [...keys].sort(), `${label} fields`);
          };
          const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const decode = (encoded, maximumCharacters, maximumBytes, label) => {
            assert.ok(typeof encoded === "string" && encoded.length > 0, `${label} missing`);
            assert.ok(encoded.length <= maximumCharacters, `${label} exceeds input limit`);
            assert.match(encoded, /^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/u);
            const bytes = Buffer.from(encoded, "base64");
            assert.ok(bytes.length > 0 && bytes.length <= maximumBytes, `${label} decoded size`);
            assert.equal(bytes.toString("base64"), encoded, `${label} must be canonical base64`);
            return bytes;
          };
          const assertPortable = (value) => {
            if (typeof value === "string") {
              assert.ok(!/^(?:[A-Za-z]:[\\/]|\\\\|\/)/u.test(value), "portable evidence contains an absolute path");
              return;
            }
            if (Array.isArray(value)) {
              for (const item of value) assertPortable(item);
              return;
            }
            if (value !== null && typeof value === "object") {
              for (const item of Object.values(value)) assertPortable(item);
            }
          };

          const runId = process.env.RELEASE_RUN_ID ?? "";
          const candidateCommit = process.env.CANDIDATE_COMMIT ?? "";
          const candidateDigest = process.env.CANDIDATE_DIGEST ?? "";
          const candidateEnvelopeDigest = process.env.CANDIDATE_ENVELOPE_DIGEST ?? "";
          const closureDigest = process.env.ACCEPTANCE_CLOSURE_DIGEST ?? "";
          const authorizationDigest = process.env.AUTHORIZATION_DIGEST ?? "";
          assert.match(runId, UUID);
          assert.match(candidateCommit, GIT_ID);
          assert.match(candidateDigest, SHA256);
          assert.match(candidateEnvelopeDigest, SHA256);
          assert.match(closureDigest, SHA256);
          assert.match(authorizationDigest, SHA256);

          const closureBytes = decode(
            process.env.ACCEPTANCE_CLOSURE_B64,
            60_000,
            45_000,
            "acceptance closure",
          );
          const authorizationBytes = decode(
            process.env.AUTHORIZATION_B64,
            16_000,
            12_000,
            "publication authorization",
          );
          assert.equal(digest(closureBytes), closureDigest, "acceptance closure digest");
          assert.equal(digest(authorizationBytes), authorizationDigest, "authorization digest");

          const candidateBytes = readFileSync(
            path.join(process.env.CANDIDATE_DIRECTORY, "candidate.json"),
          );
          assert.equal(digest(candidateBytes), candidateDigest, "candidate digest");
          const manifest = JSON.parse(readFileSync("manifest.json", "utf8"));

          const closure = JSON.parse(closureBytes.toString("utf8"));
          exactKeys(closure, [
            "authorizesPublication",
            "candidate",
            "candidateEnvelopeSha256",
            "closedAt",
            "evidence",
            "gatePassed",
            "kind",
            "policy",
            "receipt",
            "releaseCandidate",
            "runId",
            "schemaVersion",
            "status",
            "surfaces",
          ], "acceptance closure");
          assert.equal(closure.schemaVersion, 1);
          assert.equal(closure.kind, "obsidian-plugin-workspace/release-acceptance-closure-v1");
          assert.equal(closure.runId, runId);
          assert.equal(closure.status, "passed");
          assert.equal(closure.gatePassed, true);
          assert.equal(closure.authorizesPublication, false);
          assert.equal(closure.candidateEnvelopeSha256, candidateEnvelopeDigest);
          exactKeys(closure.receipt, ["sha256", "size"], "acceptance closure receipt");
          assert.match(closure.receipt.sha256, SHA256);
          assert.notEqual(closure.receipt.sha256, candidateDigest);
          assert.ok(Number.isSafeInteger(closure.receipt.size) && closure.receipt.size > 0);
          exactKeys(
            closure.releaseCandidate,
            ["candidateJsonSha256", "candidateJsonSize"],
            "acceptance closure release candidate",
          );
          assert.equal(closure.releaseCandidate.candidateJsonSha256, candidateDigest);
          assert.equal(closure.releaseCandidate.candidateJsonSize, candidateBytes.length);
          assert.ok(Array.isArray(closure.evidence) && closure.evidence.length > 0);
          exactKeys(closure.candidate, [
            "assets",
            "commit",
            "identitySha256",
            "pluginId",
            "projectId",
            "tree",
            "version",
          ], "acceptance closure candidate");
          assert.equal(closure.candidate.pluginId, manifest.id);
          assert.equal(closure.candidate.version, manifest.version);
          assert.equal(closure.candidate.version, process.env.GITHUB_REF_NAME);
          assert.equal(closure.candidate.commit, candidateCommit);
          assert.match(closure.candidate.tree, GIT_ID);
          assert.match(closure.candidate.identitySha256, SHA256);
          assertPortable(closure);

          const authorization = JSON.parse(authorizationBytes.toString("utf8"));
          exactKeys(authorization, [
            "authorizedAt",
            "authorizesPublication",
            "bindings",
            "confirmation",
            "kind",
            "runId",
            "schemaVersion",
            "singleCandidate",
          ], "publication authorization");
          exactKeys(authorization.bindings, [
            "candidateEnvelopeSha256",
            "candidateSha256",
            "closureSha256",
            "planSha256",
          ], "publication authorization bindings");
          assert.equal(authorization.schemaVersion, 1);
          assert.equal(authorization.kind, "obsidian-plugin-workspace/release-authorization-v1");
          assert.equal(authorization.runId, runId);
          assert.equal(authorization.singleCandidate, true);
          assert.equal(authorization.authorizesPublication, true);
          assert.match(authorization.bindings.planSha256, SHA256);
          assert.equal(authorization.bindings.candidateEnvelopeSha256, candidateEnvelopeDigest);
          assert.equal(authorization.bindings.candidateSha256, candidateDigest);
          assert.equal(authorization.bindings.closureSha256, closureDigest);

          const expectedPhrase = `publish ${process.env.GITHUB_REPOSITORY}@${process.env.GITHUB_REF_NAME} commit=${candidateCommit} candidate=${candidateDigest} acceptance=${closureDigest}`;
          assert.equal(process.env.RELEASE_AUTHORIZATION, expectedPhrase);
          assert.equal(authorization.confirmation, expectedPhrase);
          assertPortable(authorization);

          mkdirSync(process.env.EVIDENCE_DIRECTORY, { recursive: false });
          writeFileSync(path.join(process.env.EVIDENCE_DIRECTORY, "acceptance-closure.json"), closureBytes, { flag: "wx", mode: 0o600 });
          writeFileSync(path.join(process.env.EVIDENCE_DIRECTORY, "authorization.json"), authorizationBytes, { flag: "wx", mode: 0o600 });
          NODE

      - name: Verify fixed handoff before publication
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.verify.outputs.candidate_artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          node scripts/release.mjs verify-handoff --candidate-dir "$RUNNER_TEMP/release-candidate"

      - name: Verify publication boundary before attestation
        env:
          RELEASE_PUBLISH_AUTHORIZATION: ${{ inputs.release_authorization }}
        run: >-
          node scripts/release.mjs publication-boundary
          --candidate-dir "$RUNNER_TEMP/release-candidate"
          --candidate-digest "${{ inputs.candidate_digest }}"
          --acceptance-closure "$RUNNER_TEMP/release-evidence/acceptance-closure.json"
          --acceptance-closure-digest "${{ inputs.acceptance_closure_digest }}"

      - name: Preflight immutable GitHub Release
        id: publication_preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH_AUTHORIZATION: ${{ inputs.release_authorization }}
        run: |
          set -euo pipefail
          result_path="$RUNNER_TEMP/publication-preflight.json"
          test ! -e "$result_path"
          node scripts/release.mjs publication-preflight \
            --candidate-dir "$RUNNER_TEMP/release-candidate" \
            --candidate-digest "${{ inputs.candidate_digest }}" \
            --acceptance-closure "$RUNNER_TEMP/release-evidence/acceptance-closure.json" \
            --acceptance-closure-digest "${{ inputs.acceptance_closure_digest }}" \
            > "$result_path"
          status="$(
            node --input-type=module - "$result_path" <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const result = JSON.parse(readFileSync(process.argv[2], "utf8"));
          assert.ok(result !== null && typeof result === "object" && !Array.isArray(result));
          assert.ok(result.status === "missing" || result.status === "exact");
          process.stdout.write(result.status);
          NODE
          )"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Stage exact public asset inventory for attestation
        if: steps.publication_preflight.outputs.status == 'missing'
        env:
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/release-candidate
          PUBLIC_ASSET_DIRECTORY: ${{ runner.temp }}/release-public-assets
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { constants, copyFileSync, lstatSync, mkdirSync, readFileSync } from "node:fs";
          import path from "node:path";

          const candidate = JSON.parse(readFileSync(
            path.join(process.env.CANDIDATE_DIRECTORY, "candidate.json"),
            "utf8",
          ));
          assert.ok(Array.isArray(candidate.productionAssets));
          const names = [
            ...candidate.productionAssets.map((record) => record.name),
            candidate.archive?.name,
          ];
          assert.ok(names.length >= 3);
          assert.equal(new Set(names).size, names.length);
          mkdirSync(process.env.PUBLIC_ASSET_DIRECTORY, { recursive: false });
          for (const name of names) {
            assert.ok(
              typeof name === "string" &&
              name.length > 0 &&
              path.posix.basename(name) === name &&
              !name.includes("\\"),
            );
            const source = path.join(process.env.CANDIDATE_DIRECTORY, name);
            const status = lstatSync(source);
            assert.ok(status.isFile() && !status.isSymbolicLink());
            copyFileSync(
              source,
              path.join(process.env.PUBLIC_ASSET_DIRECTORY, name),
              constants.COPYFILE_EXCL,
            );
          }
          NODE

      - name: Attest public release assets
        if: steps.publication_preflight.outputs.status == 'missing'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-public-assets/*

      - name: Create or prove the exact GitHub Release
        if: steps.publication_preflight.outputs.status == 'missing'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH_AUTHORIZATION: ${{ inputs.release_authorization }}
        run: >-
          node scripts/release.mjs publish-github
          --candidate-dir "$RUNNER_TEMP/release-candidate"
          --candidate-digest "${{ inputs.candidate_digest }}"
          --acceptance-closure "$RUNNER_TEMP/release-evidence/acceptance-closure.json"
          --acceptance-closure-digest "${{ inputs.acceptance_closure_digest }}"

  post_verify:
    name: Verify hosted release state
    if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'publish'
    needs:
      - verify
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Check out the exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Download the same fixed candidate handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/release-candidate
          digest-mismatch: error

      - name: Reverify fixed handoff
        run: >-
          node scripts/release.mjs verify-handoff
          --candidate-dir "$RUNNER_TEMP/release-candidate"

      - name: Verify immutable hosted bytes and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release.mjs post-verify
          --candidate-dir "$RUNNER_TEMP/release-candidate"
